<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech 14 Homepage</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e8edf7;
      --muted: #9aa7bf;
      --accent: #38e8c6;
      --accent-2: #6c8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(108, 140, 255, 0.35), transparent 60%),
        radial-gradient(800px 500px at 90% 10%, rgba(56, 232, 198, 0.25), transparent 60%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 60px;
    }

    /* 상단 네비게이션 */
    nav {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 0;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    nav .logo span { color: var(--accent); }
    nav .badge {
      font-size: 0.8rem;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
    }

    /* 히어로 */
    header {
      text-align: center;
      padding: 70px 0 50px;
      animation: rise 0.8s ease both;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--accent);
      border: 1px solid rgba(56, 232, 198, 0.4);
      background: rgba(56, 232, 198, 0.08);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 26px;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff 0%, var(--accent) 60%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      margin-top: 20px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* 멤버 카드 */
    main { width: 100%; max-width: 960px; }
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 18px;
    }
    ul {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    li {
      position: relative;
      padding: 30px 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      font-size: 1.25rem;
      font-weight: 600;
      text-transform: capitalize;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      animation: rise 0.8s ease both;
    }
    li:nth-child(1) { animation-delay: 0.15s; }
    li:nth-child(2) { animation-delay: 0.3s; }
    li:nth-child(3) { animation-delay: 0.45s; }
    li:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 18px 40px rgba(56, 232, 198, 0.15);
    }
    li::before {
      content: "";
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    li small {
      display: block;
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
      text-transform: none;
    }

    footer {
      margin-top: 70px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Fin<span>Tech</span> 14</div>
    <div class="badge">Class Demo</div>
  </nav>

  <header>
    <span class="eyebrow">Fintech Course · Cohort 14</span>
    <h1>Welcome to<br>Fintech 14 Homepage</h1>
    <p class="sub">데이터와 금융, 그리고 기술이 만나는 곳</p>
  </header>

  <main>
    <p class="section-title">Members</p>
    <ul>
      <li>instructor<small>Course instructor</small></li>
      <li>student1<small>Student</small></li>
      <li>student2<small>Student</small></li>
    </ul>
  </main>

  <footer>© 2026 Fintech 14</footer>
</body>
</html>
