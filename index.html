<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech 14 Homepage</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e8edf7;
      --muted: #9aa7bf;
      --accent: #38e8c6;
      --accent-2: #6c8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(108, 140, 255, 0.35), transparent 60%),
        radial-gradient(800px 500px at 90% 10%, rgba(56, 232, 198, 0.25), transparent 60%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 60px;
    }
